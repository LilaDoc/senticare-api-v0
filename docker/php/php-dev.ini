; Configuration PHP — DÉVELOPPEMENT
;
; Déposée dans /usr/local/etc/php/conf.d/, où PHP charge automatiquement tous
; les .ini. Ces valeurs s'ajoutent aux réglages par défaut de l'image.

; Les erreurs s'affichent : on veut les voir tout de suite, pas les chercher
; dans un journal.
display_errors = On
error_reporting = E_ALL

; Confortable pour Doctrine et dompdf.
memory_limit = 256M

; ⚠️ Point ouvert : les colonnes PostgreSQL sont en `timestamp without time
;    zone` et l'API sérialise en +00:00. Une déclaration saisie à 9h20 se
;    réaffiche à 11h20 dans un navigateur parisien. Voir le piège n°9 de
;    docs/API_CONTRACT.md côté front — à trancher avant l'écran de liste.
date.timezone = Europe/Paris

; Retire l'en-tête `X-Powered-By: PHP/8.3.6`. Annoncer sa version exacte revient
; à indiquer quelles failles connues essayer.
expose_php = Off
