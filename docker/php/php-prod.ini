; Configuration PHP — PRODUCTION
;
; Déposée dans /usr/local/etc/php/conf.d/, où PHP charge automatiquement tous
; les .ini. Ces valeurs s'ajoutent aux réglages par défaut de l'image.

; ⚠️ Les erreurs ne s'affichent JAMAIS. Une trace expose des chemins de
;    fichiers, des versions de bibliothèques et parfois des identifiants de
;    connexion — c'est une fuite d'information exploitable (CDC §6.3).
display_errors = Off
log_errors = On

; Vers la sortie d'erreur standard plutôt qu'un fichier : c'est la convention
; Docker, les journaux sont alors récupérés par `docker compose logs`.
error_log = /dev/stderr

memory_limit = 256M

; Les déclarations ne contiennent que du texte, et aucun téléversement n'est
; prévu en V1. Doit rester cohérent avec `client_max_body_size` de nginx.
post_max_size = 8M

; Une requête d'API ne doit jamais durer plus longtemps. Au-delà, c'est un bug.
max_execution_time = 30

date.timezone = Europe/Paris

expose_php = Off
